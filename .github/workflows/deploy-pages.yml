name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            map-docs/package-lock.json
            map-example/package-lock.json

      - name: Install docs dependencies
        working-directory: map-docs
        run: npm ci

      - name: Build docs
        working-directory: map-docs
        run: npm run build

      - name: Install example dependencies
        working-directory: map-example
        run: npm ci

      - name: Build example
        working-directory: map-example
        env:
          VITE_CESIUM_ION_ACCESS_TOKEN: ${{ secrets.VITE_CESIUM_ION_ACCESS_TOKEN }}
        run: npm run build

      - name: Compose Pages artifact
        run: |
          mkdir -p pages/example
          cp -R map-docs/docs/.vitepress/dist/. pages/
          cp -R map-example/dist/. pages/example/
          touch pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
